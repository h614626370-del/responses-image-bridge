services:
  bridge:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8787:8787"
    read_only: true
    volumes:
      - bridge-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  bridge-data:
